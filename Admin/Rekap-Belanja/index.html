<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoroDuit — Rekap Belanja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📊 Rekap Belanja</h1>
    <p class="subtitle">Pilih nota untuk melihat rekap belanja</p>
  </header>

  <main>
    <!-- Status / error message -->
    <div id="statusMessage" class="status-message hidden" role="alert" aria-live="polite"></div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading">Memuat riwayat transaksi...</div>

    <!-- Riwayat list (rendered by JS) -->
    <div id="riwayatList" class="riwayat-list"></div>

    <!-- Lanjut button (fixed bottom) -->
    <div id="actionBar" class="action-bar hidden">
      <span id="selectedInfo" class="selected-info">0 nota dipilih</span>
      <button id="btnLanjut" class="btn btn-primary" disabled>Lanjut →</button>
    </div>
  </main>

  <footer>
    <p>MoroDuit &mdash; Toko Sembako Online</p>
  </footer>

  <script src="../../config.js"></script>
  <script src="script.js"></script>
</body>
</html>
