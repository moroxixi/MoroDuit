<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoroDuit — Riwayat Transaksi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📋 Riwayat Transaksi</h1>
    <p class="subtitle">Daftar semua nota belanja</p>
  </header>

  <main>
    <!-- Status / error message -->
    <div id="statusMessage" class="status-message hidden" role="alert" aria-live="polite"></div>

    <!-- Navigation bar -->
    <div class="nav-bar">
      <button type="button" id="btnModeToggle" class="nav-btn">📅 Bulanan</button>
      <button type="button" id="btnPrev" class="nav-btn nav-btn-arrow">&laquo;</button>
      <span id="periodeLabel" class="periode-label">Memuat...</span>
      <button type="button" id="btnNext" class="nav-btn nav-btn-arrow">&raquo;</button>
      <button type="button" id="btnGoToToday" class="nav-btn nav-btn-primary">Hari Ini</button>
    </div>

    <!-- Profit summary for active period -->
    <div id="profitSummary" class="profit-summary hidden">
      <span class="profit-summary-label">Profit periode ini:</span>
      <span id="profitSummaryValue" class="profit-value">0</span>
    </div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading">Memuat riwayat transaksi...</div>

    <!-- Riwayat list (rendered by JS) -->
    <div id="riwayatList" class="riwayat-list"></div>
  </main>

  <footer>
    <p>MoroDuit &mdash; Toko Sembako Online</p>
  </footer>

  <script src="../../config.js"></script>
  <script src="script.js"></script>
</body>
</html>
