<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoroDuit — Edit Transaksi</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ── Mode-Edit specific overrides ──────────────────────────────── */
    .nota-info {
      padding: 1rem 1.25rem;
      background-color: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .nota-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.25rem 0;
    }

    .nota-info-label {
      font-size: 0.85rem;
      color: #666666;
    }

    .nota-info-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .nota-info-value.highlight {
      color: #2e7d32;
      font-weight: 700;
    }

    /* ── Item card ────────────────────────────────────────────────── */
    .item-card {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .item-card:hover {
      border-color: #bdbdbd;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-produk {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a1a1a;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .item-harga {
      font-size: 0.8rem;
      color: #666666;
    }

    .item-subtotal {
      font-size: 0.85rem;
      font-weight: 700;
      color: #2e7d32;
      white-space: nowrap;
    }

    .price-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #ff9800;
      border-radius: 4px;
      padding: 0.1rem 0.35rem;
      margin-left: 0.35rem;
      vertical-align: middle;
    }

    /* ── Qty stepper (reuse Keranjang pattern) ─────────────────────── */
    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .qty-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      min-width: 2.25rem;
      min-height: 2.25rem;
      padding: 0;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      background-color: #2e7d32;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    .qty-btn:active:not(:disabled) {
      transform: scale(0.93);
    }

    .qty-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background-color: #bdbdbd;
    }

    .qty-display {
      width: 2.5rem;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    /* ── Delete button ─────────────────────────────────────────────── */
    .btn-delete {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      padding: 0;
      font-size: 1rem;
      color: #c62828;
      background-color: #ffebee;
      border: 2px solid #ffcdd2;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-delete:hover {
      background-color: #ffcdd2;
    }

    .btn-delete:active {
      transform: scale(0.93);
    }

    /* ── Add product section ───────────────────────────────────────── */
    .add-product-section {
      margin-top: 0.75rem;
    }

    .btn-add {
      display: block;
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #2e7d32;
      background-color: #ffffff;
      border: 2px dashed #2e7d32;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-add:hover {
      background-color: #f1f8e9;
    }

    .btn-add:active {
      transform: scale(0.98);
    }

    .add-product-panel {
      display: none;
      margin-top: 0.5rem;
      padding: 1rem;
      background-color: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
    }

    .add-product-panel.open {
      display: block;
    }

    .add-search-input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      border: 2px solid #bdbdbd;
      border-radius: 8px;
      background-color: #f5f5f5;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }

    .add-search-input:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.25);
    }

    .add-search-results {
      max-height: 240px;
      overflow-y: auto;
    }

    .add-search-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .add-search-item:last-child {
      border-bottom: none;
    }

    .add-search-item:hover {
      background-color: #f1f8e9;
    }

    .add-search-item:active {
      background-color: #e8f5e9;
    }

    .add-search-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .add-search-price {
      font-size: 0.8rem;
      color: #2e7d32;
      font-weight: 600;
      white-space: nowrap;
    }

    .add-search-empty {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: #666666;
    }

    /* ── Total bar ────────────────────────────────────────────────── */
    .total-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background-color: #ffffff;
      border: 2px solid #2e7d32;
      border-radius: 10px;
      margin-top: 1rem;
      margin-bottom: 0.75rem;
    }

    .total-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .total-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2e7d32;
    }

    /* ── Action buttons ───────────────────────────────────────────── */
    .action-bar {
      display: flex;
      gap: 0.75rem;
    }

    .action-bar .btn {
      flex: 1;
      text-align: center;
    }

    .btn-primary {
      background-color: #2e7d32;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1b5e20;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: #1a1a1a;
      border: 2px solid #bdbdbd;
    }

    .btn-secondary:hover {
      background-color: #f5f5f5;
    }

    .btn {
      padding: 0.875rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 52px;
      white-space: nowrap;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* ── Items list gap ────────────────────────────────────────────── */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ── Error state ──────────────────────────────────────────────── */
    .error-state {
      text-align: center;
      padding: 2rem 1rem;
    }

    .error-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    .error-text {
      font-size: 0.95rem;
      color: #666666;
      margin-bottom: 1rem;
    }

    .error-link {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2e7d32;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .error-link:hover {
      background-color: #1b5e20;
    }

    /* ── Mobile ────────────────────────────────────────────────────── */
    @media (max-width: 520px) {
      .item-card {
        flex-wrap: wrap;
      }

      .item-info {
        flex-basis: 100%;
      }

      .action-bar {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>✏️ Edit Transaksi</h1>
    <p class="subtitle" id="headerSubtitle">Memuat data...</p>
  </header>

  <main>
    <!-- Status / error message -->
    <div id="statusMessage" class="status-message hidden" role="alert" aria-live="polite"></div>

    <!-- Error state (noNota not found or missing) -->
    <div id="errorState" class="error-state" style="display: none;">
      <div class="error-icon">📋</div>
      <p class="error-text" id="errorText">Data riwayat tidak ditemukan.</p>
      <a href="../index.html" class="error-link">← Kembali ke Riwayat</a>
    </div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading" style="display: none;">Memuat data transaksi...</div>

    <!-- Nota info (shown when data loaded) -->
    <div id="notaInfo" class="nota-info" style="display: none;">
      <div class="nota-info-row">
        <span class="nota-info-label">No Nota</span>
        <span class="nota-info-value highlight" id="displayNoNota">-</span>
      </div>
      <div class="nota-info-row">
        <span class="nota-info-label">Pelanggan</span>
        <span class="nota-info-value" id="displayPelanggan">-</span>
      </div>
    </div>

    <!-- Items list (rendered by JS) -->
    <div id="itemsList" class="items-list"></div>

    <!-- Add product section -->
    <div class="add-product-section" id="addProductSection" style="display: none;">
      <button type="button" class="btn-add" id="btnAddProduct">+ Tambah Produk</button>
      <div class="add-product-panel" id="addProductPanel">
        <input type="text" class="add-search-input" id="addSearchInput"
               placeholder="Cari produk..." maxlength="100" autocomplete="off">
        <div class="add-search-results" id="addSearchResults"></div>
      </div>
    </div>

    <!-- Total bar -->
    <div class="total-bar" id="totalBar" style="display: none;">
      <span class="total-label">Total</span>
      <span class="total-value" id="totalValue">Rp 0</span>
    </div>

    <!-- Action buttons -->
    <div class="action-bar" id="actionBar" style="display: none;">
      <button type="button" class="btn btn-secondary" id="batalBtn">❌ Batal</button>
      <button type="button" class="btn btn-primary" id="lanjutBtn" disabled>🛒 Lanjut ke Priview</button>
    </div>
  </main>

  <script src="../../../config.js"></script>
  <script src="script.js"></script>
</body>
</html>
