<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoroDuit — Katalog Produk</title>
  <style>
    /* ══════════════════════════════════════════════════════════════════════
       MoroDuit Katalog — Browse-only product catalog
       Inline styles (no shared CSS across Customer/ pages)
       ══════════════════════════════════════════════════════════════════════ */

    /* ── Reset & Base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #1a1a1a;
      background: linear-gradient(170deg, #f5f0e8 0%, #eef7eb 100%);
      min-height: 100vh;
      padding: 1rem;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 1.5rem 1rem;
      background-color: #2e7d32;
      color: #ffffff;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    header .subtitle { font-size: 0.9rem; opacity: 0.9; }

    /* ── Main ──────────────────────────────────────────────────────────── */
    main { max-width: 800px; margin: 0 auto; }

    /* ── Loading ───────────────────────────────────────────────────────── */
    .loading {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #666666;
    }

    /* ── Empty State ───────────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #666666;
      font-weight: 600;
    }

    /* ── Filter Bar ───────────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .filter-search { flex: 1; }
    .filter-search input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font-size: 1rem;
      border: 2px solid #bdbdbd;
      border-radius: 8px;
      background-color: #ffffff;
      color: #1a1a1a;
      transition: border-color 0.2s;
    }
    .filter-search input[type="text"]:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.25);
    }

    /* ── Kategori Chips ────────────────────────────────────────────────── */
    .kategori-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .kategori-chip {
      padding: 0.4rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      border: 2px solid #c8e6c9;
      border-radius: 20px;
      background-color: #ffffff;
      color: #2e7d32;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }
    .kategori-chip:hover { border-color: #2e7d32; background-color: #f1f8e9; }
    .kategori-chip.active {
      background-color: #2e7d32;
      color: #ffffff;
      border-color: #2e7d32;
    }
    .kategori-chip:focus-visible {
      outline: 3px solid #1b5e20;
      outline-offset: 2px;
    }

    @media (max-width: 520px) {
      .filter-bar { flex-direction: column; gap: 0.5rem; }
    }

    /* ── Product Grid ──────────────────────────────────────────────────── */
    .produk-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    @media (min-width: 768px) {
      .produk-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
    }

    /* ── Product Card ──────────────────────────────────────────────────── */
    .produk-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }
    .produk-card:hover { border-color: #2e7d32; }
    @media (min-width: 768px) {
      .produk-card { padding: 1rem; gap: 1rem; }
    }

    /* ── Product Foto ──────────────────────────────────────────────────── */
    .produk-foto {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background-color: #f5f5f5;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-width: 768px) {
      .produk-foto { width: 80px; height: 80px; }
    }
    .produk-foto-img { width: 100%; height: 100%; object-fit: cover; }
    .produk-foto-placeholder { width: 1.5rem; height: 1.5rem; color: #bdbdbd; }

    /* ── Product Info ──────────────────────────────────────────────────── */
    .produk-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .produk-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a1a1a;
      word-break: normal;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @media (min-width: 768px) { .produk-name { font-size: 0.95rem; } }
    .produk-kategori {
      font-size: 0.75rem;
      color: #888888;
      font-weight: 500;
    }
    .produk-harga {
      font-size: 0.9rem;
      font-weight: 700;
      color: #2e7d32;
      white-space: nowrap;
    }

    /* ── Footer ────────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      margin-top: 2rem;
      color: #666666;
      font-size: 1rem;
    }

    /* ── Accessibility ─────────────────────────────────────────────────── */
    a:focus-visible, button:focus-visible {
      outline: 3px solid #1b5e20;
      outline-offset: 2px;
      border-radius: 4px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📦 Katalog Produk</h1>
    <p class="subtitle">Lihat daftar produk yang tersedia</p>
  </header>

  <main>
    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading">Memuat daftar produk...</div>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="filter-search">
        <input type="text" id="searchInput" placeholder="Cari produk atau kategori..." maxlength="100">
      </div>
    </div>

    <!-- Kategori chips (populated by JS) -->
    <div id="kategoriChips" class="kategori-chips"></div>

    <!-- Product grid (rendered by JS) -->
    <div id="produkGrid" class="produk-grid"></div>
  </main>

  <footer>
    <p>MoroDuit &mdash; Toko Sembako Online</p>
  </footer>

  <script src="../../config.js"></script>
  <script src="script.js"></script>
</body>
</html>
