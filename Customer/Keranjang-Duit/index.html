<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoroDuit — Keranjang Duit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🛒 Keranjang Moro Duit.</h1>
    <p class="subtitle">Pilih produk yang mau dibeli</p>
  </header>

  <main>
    <!-- Status / error message -->
    <div id="statusMessage" class="status-message hidden" role="alert" aria-live="polite"></div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading">Memuat daftar produk...</div>

    <!-- Nama Pelanggan (optional) -->
    <div class="pelanggan-input">
      <label for="namaPelanggan">Nama Pelanggan <span class="optional">(opsional)</span></label>
      <input type="text" id="namaPelanggan" name="namaPelanggan"
             placeholder="Isi nama pelanggan..." maxlength="100">
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="filter-search">
        <input type="text" id="searchInput" placeholder="Cari produk..." maxlength="100">
      </div>
      <div class="filter-kategori">
        <select id="kategoriFilter">
          <option value="">Semua Kategori</option>
        </select>
      </div>
    </div>

    <!-- Product list (rendered by JS) -->
    <div id="produkList" class="produk-list"></div>

    <!-- Total bar (sticky at bottom) -->
    <div id="totalBar" class="total-bar">
      <div class="total-info">
        <span class="total-label">Total Belanja:</span>
        <span id="totalValue" class="total-value">Rp 0</span>
      </div>
      <button id="checkoutBtn" class="btn btn-primary" disabled>
        💳 Checkout
      </button>
      <button id="kosongkanBtn" class="btn btn-danger">
        🗑️ Kosongkan Keranjang
      </button>
    </div>
  </main>

  <footer>
    <p>Moro Duit. &mdash; Toko Sembako Online.</p>
  </footer>

  <script src="../../config.js"></script>
  <script src="script.js"></script>
</body>
</html>
